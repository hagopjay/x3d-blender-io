name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is what Blender 4.5 and 5.0 bundle, 3.13 what 5.1+ bundles.
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install test tools
        # x3d is the Web3D Consortium's Python package; the semantic validator in tests uses it when present.
        run: python -m pip install --quiet ruff x3d
      - name: Syntax errors (ruff, blocking)
        run: ruff check --select E9,F63,F7 --output-format github source tests
      - name: Undefined names (ruff, advisory until the legacy exporter is cleaned up)
        continue-on-error: true
        run: ruff check --select F82 --output-format github source tests
      - name: Run tests without Blender
        env:
          X3D_STRICT_VALIDATION: "1"   # tests may treat x3d-package validation warnings as failures when set
        run: python .github/scripts/run_tests_in_blender.py

  bpy-wheel:
    name: Round-trip tests with the bpy wheel (Python 3.11)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Runtime libraries for bpy
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 libgl1 libegl1 libglx-mesa0
      - name: Install bpy and x3d
        # The bpy wheel pins Python 3.11; it imports with harmless cattrs and bl_pkg warnings on stderr.
        run: python -m pip install --quiet bpy x3d
      - name: Run all tests, including the bpy round-trip tests
        env:
          X3D_STRICT_VALIDATION: "1"
        run: python .github/scripts/run_tests_in_blender.py

  blender:
    name: Blender ${{ matrix.blender }} headless
    runs-on: ubuntu-latest
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        # 4.5.x is the LTS most users run, 5.2.x is the first 5.x LTS, 5.1.x is
        # the first release on Python 3.13. Bump these when Blender ships point releases.
        blender: ["4.5.14", "5.1.2", "5.2.2"]
    env:
      BLENDER_DIR: ${{ github.workspace }}/.blender/${{ matrix.blender }}
      BLENDER_USER_RESOURCES: ${{ github.workspace }}/.blender-profile
    steps:
      - uses: actions/checkout@v7

      - name: Runtime libraries for headless Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 \
            libgl1 libegl1 libglx-mesa0 xz-utils

      - name: Cache Blender ${{ matrix.blender }}
        id: cache-blender
        uses: actions/cache@v6
        with:
          path: ${{ env.BLENDER_DIR }}
          key: blender-linux-x64-${{ matrix.blender }}

      - name: Download Blender ${{ matrix.blender }}
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: bash .github/scripts/install_blender.sh "${{ matrix.blender }}" "$BLENDER_DIR"

      - name: Blender version
        run: '"$BLENDER_DIR/blender" --version'

      - name: Build the extension zip and validate the manifest
        run: |
          mkdir -p dist
          "$BLENDER_DIR/blender" -b --command extension build \
            --source-dir source --output-filepath "dist/x3d-blender-io-blender${{ matrix.blender }}.zip"
          "$BLENDER_DIR/blender" -b --command extension validate "dist/x3d-blender-io-blender${{ matrix.blender }}.zip"

      - name: Install the built extension into a clean profile and enable it
        run: |
          mkdir -p "$BLENDER_USER_RESOURCES"
          "$BLENDER_DIR/blender" -b --command extension install-file \
            --repo user_default --enable "dist/x3d-blender-io-blender${{ matrix.blender }}.zip"
          "$BLENDER_DIR/blender" -b --python-exit-code 1 \
            --python .github/scripts/check_extension_enabled.py

      - name: Run the unit tests inside Blender's Python
        run: |
          "$BLENDER_DIR/blender" -b --python-exit-code 1 \
            --python .github/scripts/run_tests_in_blender.py

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: extension-zip-blender-${{ matrix.blender }}
          path: dist/*.zip
          if-no-files-found: ignore
