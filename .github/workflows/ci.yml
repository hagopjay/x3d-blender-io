name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      gate_full:
        description: "Export gate: run all 33 repo scenes (scenes-repo.json, which holds the probes) instead of the 9-scene subset"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is what Blender 4.5 and 5.0 bundle, 3.13 what 5.1+ bundles.
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install test tools
        # x3d is the Web3D Consortium's Python package; the semantic validator in tests uses it when present. Pinned (the same
        # version as the export gate's rig, tools/fidelity_rig/gate-baseline.json): a new release can add field checks and turn runs red.
        run: python -m pip install --quiet ruff x3d==4.0.65.8
      - name: Syntax errors (ruff, blocking)
        run: ruff check --select E9,F63,F7 --output-format github source tests
      - name: Undefined names (ruff, advisory until the legacy exporter is cleaned up)
        continue-on-error: true
        run: ruff check --select F82 --output-format github source tests
      - name: Run tests without Blender
        env:
          X3D_STRICT_VALIDATION: "1"   # tests may treat x3d-package validation warnings as failures when set
        run: python .github/scripts/run_tests_in_blender.py

  bpy-wheel:
    name: Round-trip tests with the bpy wheel (Python 3.11)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Runtime libraries for bpy
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 libgl1 libegl1 libglx-mesa0
      - name: Install bpy and x3d
        # The bpy wheel pins Python 3.11; it imports with harmless cattrs and bl_pkg warnings on stderr.
        run: python -m pip install --quiet bpy x3d==4.0.65.8
      - name: Install the Khronos glTF Validator for the glb gate test
        # Node is preinstalled on ubuntu-latest. The version is the one pinned in tools/fidelity_rig/package.json;
        # tests/test_glb_validator_bpy.py fails when the two differ. This install stays apart from the rig's npm ci: gltf-validator
        # has no dependencies, so the exact version is already the whole tree; the lock would add only the tarball's integrity
        # check, and using it means either the rig's whole tree (X_ITE, Babylon.js, Playwright) in a job that runs no browser
        # or a second, stripped package.json written here that could drift from the rig's.
        run: |
          node --version
          npm install --prefix "$RUNNER_TEMP/gltf-validator" --no-audit --no-fund gltf-validator@2.0.0-dev.3.10
      - name: Run all tests, including the bpy round-trip tests
        env:
          X3D_STRICT_VALIDATION: "1"
          GLTF_VALIDATOR_DIR: ${{ runner.temp }}/gltf-validator/node_modules/gltf-validator
          GLTF_VALIDATOR_REQUIRED: "1"   # tests/test_glb_validator_bpy.py fails instead of skipping when the validator cannot load
        run: python .github/scripts/run_tests_in_blender.py

  blender:
    name: Blender ${{ matrix.blender }} headless
    runs-on: ubuntu-latest
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        # 4.5.x is the LTS most users run, 5.2.x is the first 5.x LTS, 5.1.x is
        # the first release on Python 3.13. Bump these when Blender ships point releases.
        blender: ["4.5.14", "5.1.2", "5.2.2"]
    env:
      BLENDER_DIR: ${{ github.workspace }}/.blender/${{ matrix.blender }}
      BLENDER_USER_RESOURCES: ${{ github.workspace }}/.blender-profile
    steps:
      - uses: actions/checkout@v7

      - name: Runtime libraries for headless Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 \
            libgl1 libegl1 libglx-mesa0 xz-utils

      - name: Cache Blender ${{ matrix.blender }}
        id: cache-blender
        uses: actions/cache@v6
        with:
          path: ${{ env.BLENDER_DIR }}
          key: blender-linux-x64-${{ matrix.blender }}

      - name: Download Blender ${{ matrix.blender }}
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: bash .github/scripts/install_blender.sh "${{ matrix.blender }}" "$BLENDER_DIR"

      - name: Blender version
        run: '"$BLENDER_DIR/blender" --version'

      - name: Build the extension zip and validate the manifest
        run: |
          mkdir -p dist
          "$BLENDER_DIR/blender" -b --command extension build \
            --source-dir source --output-filepath "dist/x3d-blender-io-blender${{ matrix.blender }}.zip"
          "$BLENDER_DIR/blender" -b --command extension validate "dist/x3d-blender-io-blender${{ matrix.blender }}.zip"

      - name: Install the built extension into a clean profile and enable it
        run: |
          mkdir -p "$BLENDER_USER_RESOURCES"
          "$BLENDER_DIR/blender" -b --command extension install-file \
            --repo user_default --enable "dist/x3d-blender-io-blender${{ matrix.blender }}.zip"
          "$BLENDER_DIR/blender" -b --python-exit-code 1 \
            --python .github/scripts/check_extension_enabled.py

      - name: Run the unit tests inside Blender's Python
        run: |
          "$BLENDER_DIR/blender" -b --python-exit-code 1 \
            --python .github/scripts/run_tests_in_blender.py

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: extension-zip-blender-${{ matrix.blender }}
          path: dist/*.zip
          if-no-files-found: ignore

  suite:
    name: Export conformance suite (Blender 5.1.2)
    runs-on: ubuntu-latest
    needs: unit
    env:
      BLENDER_DIR: ${{ github.workspace }}/.blender/5.1.2
    steps:
      - uses: actions/checkout@v7

      - name: Runtime libraries for headless Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 \
            libgl1 libegl1 libglx-mesa0 xz-utils

      - name: Cache Blender 5.1.2
        id: cache-blender
        uses: actions/cache@v6
        with:
          path: ${{ env.BLENDER_DIR }}
          key: blender-linux-x64-5.1.2

      - name: Download Blender 5.1.2
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: bash .github/scripts/install_blender.sh "5.1.2" "$BLENDER_DIR"

      - name: Build the 195-case scene and export it with this checkout
        # --repo registers <checkout>/source as the exporter, so the suite tests the code under review.
        run: |
          "$BLENDER_DIR/blender" -b --factory-startup -noaudio --python-exit-code 1 \
            --python tests/suite/x3d_test_suite.py -- --out suite-out --repo "$GITHUB_WORKSPACE" --export

      - name: Validate the exports (fails when any CORE case fails)
        run: python3 tests/suite/validate_x3d_export.py suite-out --html suite-out/report.html

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: export-suite-report
          path: |
            suite-out/report.html
            suite-out/x3d_suite_manifest.json
          if-no-files-found: ignore

  fidelity-gate:
    name: Export gate (glTF validator + render diff against X_ITE)
    runs-on: ubuntu-latest
    needs: unit
    # A normal run takes minutes. gate.py bounds every render.mjs process (60 s plus 200 s per job, so 1,660 s for a chunk of 8) and
    # reruns a job that failed once, so a hung page costs at most that, not the whole job; 45 minutes leaves room for one such hang.
    timeout-minutes: 45
    env:
      # The baseline (tools/fidelity_rig/gate-baseline.json) was measured on this rig: bpy 5.3.0 on Python 3.13, x3d (x3d.py) 4.0.65.8,
      # numpy 2.5.3, Pillow 12.3.0, flip-evaluator 1.7, X_ITE 16.7.1, Babylon.js 9.32.0, gltf-validator 2.0.0-dev.3.10 and Playwright's
      # Chromium (SwiftShader); the Node packages are pinned in package.json and locked in package-lock.json (npm ci).
      # gate.py --strict-fingerprint fails when any of them differs.
      BPY_PYTHON: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Runtime libraries for bpy
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 libgl1 libegl1 libglx-mesa0
      - name: Install bpy and the Python libraries of the rig
        # bpy exports both legs; x3d is the semantic X3D validator (its error count is a zero-tolerance check, so the version is pinned);
        # numpy, pillow and flip-evaluator do the image deltas. The versions are the baseline header's rig.
        run: python -m pip install --quiet bpy==5.3.0 x3d==4.0.65.8 numpy==2.5.3 pillow==12.3.0 flip-evaluator==1.7
      - name: Install the rig's Node packages (X_ITE, Babylon.js, Playwright, glTF Validator)
        working-directory: tools/fidelity_rig
        # npm ci, not npm install: it installs exactly what the committed package-lock.json records (the version and sha512
        # integrity of every package, Playwright's and Babylon.js's own dependencies included) and fails when package.json and the
        # lock disagree, where npm install may re-resolve and rewrite the lock. The baseline was measured on these versions.
        run: |
          node --version
          npm ci --no-audit --no-fund
      - name: Install Chromium for Playwright
        working-directory: tools/fidelity_rig
        run: npx playwright install --with-deps chromium
      - name: Run the gate
        working-directory: tools/fidelity_rig
        # Default: the 5 probes and 4 quick showcase scenes (scenes-gate-ci.json). Manual runs can ask for every repo scene.
        # Exit 1 on any FAIL; out/ci/gate_results.json is written first. --strict-fingerprint fails when the pinned rig drifts.
        run: |
          if [ "${{ inputs.gate_full }}" = "true" ]; then
            python gate.py --scenes probes.json scenes-repo.json --label ci --jobs 2 --strict-fingerprint
          else
            python gate.py --scenes scenes-gate-ci.json --label ci --jobs 2 --strict-fingerprint
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fidelity-gate-results
          path: |
            tools/fidelity_rig/out/ci/gate_results.json
            tools/fidelity_rig/out/ci/*/measured.json
            tools/fidelity_rig/out/ci/*/manifest.json
            tools/fidelity_rig/out/ci/*/*.png
            tools/fidelity_rig/out/ci/*/reexp/*.png
            tools/fidelity_rig/out/ci/*/reexp/roundtrip.x3d
            tools/fidelity_rig/out/ci/*/scene.glb.validation.json
          if-no-files-found: warn   # a job killed before gate.py wrote gate_results.json must not look like a clean upload
